version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 10
    ignore:
      # Skeleton 5.0.1 (estate ruling RP1, TIN-5694) + Tailwind v4 are pinned
      # exact; moves are made by hand with a ticketed proof, not by Dependabot.
      - dependency-name: '@skeletonlabs/skeleton'
      - dependency-name: '@skeletonlabs/skeleton-svelte'
      - dependency-name: 'tailwindcss'
        update-types:
          - 'version-update:semver-major'
      # Toolchain pins mirrored in MODULE.bazel — majors need a ticketed proof.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # Framework and test-runner majors move with the estate (RU1/RU5 exact
      # pins, site.scaffold estate manifest), not per spoke.
      - dependency-name: '@sveltejs/*'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'vitest'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@vitest/*'
        update-types:
          - 'version-update:semver-major'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'main'
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
